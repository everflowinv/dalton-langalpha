# Dalton 数据源说明清单（按来源 id 维护）
# 供 src/dalton/data_map/builder.py 与研究库 catalog、体检状态、对话归档统计合并渲染。
# 若研究库 catalog 中新增了此处未登记的路由（且不在 handoff_routes 过滤名单中），构建器会自动列出并标注“未写说明”。

handoff_filtered_routes:
  - web-news
  - web-page
  - filings
  - last30days
  - agent-reach
  - x-timeline
  - x-search
  - xueqiu
  - employee

catalog_routes:
  all:
    category: research
    title: 跨库初筛
    rules: "四库+AE+GP,不含transcript"
    description: "四库+卖方/专家联搜，不确定资料在哪时初筛。"
  alphaengine:
    category: research
    title: 卖方研报
    rules: "search_library后get_document"
    description: "卖方研报/纪要/目标价，查大行观点与分歧。"
  guidepoint:
    category: research
    title: 专家访谈
    rules: "匿名引职务,原话≤20词"
    description: "供应链/渠道/竞品专家访谈，查产业景气与格局。"
  transcript:
    category: research
    title: 业绩会转写
    rules: "all不含,须单调"
    description: "财报电话会与回访全文，核对管理层原话、指引与Q&A。"
  company-wiki:
    category: research
    title: 公司资料库
    rules: "只读;params.company=TICKER"
    description: "已入库公司笔记与行业沉淀，调取标的背景。"
  sales-notes:
    category: research
    title: 销售邮件
    rules: "raw独立源/digest线索"
    description: "交易台反馈、bogey/whisper与早报，查催化与资金。"
  tmtb:
    category: research
    title: TMT总结
    rules: "转述与原件计同源"
    description: "TMT收盘总结与盘前盘后复盘，查科技股涨跌原因。"
  funda-ai:
    category: research
    title: FUNDA AI
    rules: "先search再read"
    description: "FUNDA AI拆解与高频图，查AI算力与科技跟踪。"
  sec:
    category: finance
    title: 美股SEC
    rules: "10-K/10-Q/8-K/20-F/6-K"
    description: "美股SEC公告原文与报表，核实法定披露与附注。"
  estimates:
    category: finance
    title: 一致预期
    rules: "operation=consensus"
    description: "营收/EPS等一致预期快照，用于Beat/Miss对比。"
  cn-hk:
    category: finance
    title: 港A股财务公告
    rules: "operation=ask|filings"
    description: "巨潮公告（`filings`）＋港 A 股财务、估值、资金面（`ask`）。"
  fred:
    category: macro
    title: FRED宏观
    rules: "series+start+end必填"
    description: "美国通胀/就业/GDP/利率序列，查宏观与折现率。"
  treasury:
    category: macro
    title: TGA与联邦债务
    rules: "operation=treasury, dataset=tga|debt"
    description: "财政部TGA日度余额与联邦债务（百万美元/美元），查流动性；国债收益率走fred（DGS2/DGS10）。"

direct_tools:
  conversation_search:
    category: memory
    title: 团队对话归档
    call: "conversation_search"
    description: "团队过往事实、预测、模型假设、观点、问题、决定、待办卡片及原话出处，查公司/主题既有看法并对比变化。"
  web_search:
    category: web
    title: 全网新闻
    call: "web_search"
    description: "公开媒体报道、突发新闻与监管动态，查盘前盘后催化与公开事件。"
  x_search:
    category: social
    title: X社媒检索
    call: "x_search"
    description: "X实时讨论、管理层/KOL发言与第一反应(只引带链接帖)，查情绪与传闻。"
  market_quotes:
    category: market
    title: 行情与K线
    call: "get_quote/get_daily_prices/get_market_overview"
    description: "美/港/A股及指数报价、日K与大盘，核对股价与复盘。"
  company_options_screener:
    category: market
    title: 公司与期权选股
    call: "get_company_overview/get_options_chain/screen_stocks"
    description: "公司基本面快照、美股期权链及选股，用于公司画像与期权波动。"
  sec_filings:
    category: filing
    title: SEC XBRL与报表
    call: "dalton_sec/get_sec_filing"
    description: "美股归一化XBRL财务事实(含重述)及报表原文，用于建模与核对。"

unavailable_sources:
  - id: hkexnews
    title: 港交所披露易公告
    note: "未接通，用 `web_search` 查 `site:hkexnews.hk`。"
  - id: futures_commodities
    title: 期货与大宗商品实时行情
    note: "ES/NQ期货、原油、黄金等未接专门行情源；用web_search/x_search/sales-notes/tmtb查侧面报道，勿假装查过实时期货报价。"
  - id: xueqiu
    title: 雪球(xueqiu)
    note: "handoff过滤，不可用。"
  - id: employee
    title: 员工评论(employee/Glassdoor/Blind)
    note: "handoff过滤，不可用。"
  - id: institutional_13f_flow
    title: 13F持仓与暗池/期权异动流
    note: "未接通(静态期权链用get_options_chain)。"
  - id: alt_data
    title: 高频另类数据(信用卡/SensorTower/卫星/海关)
    note: "未接直连，仅从alphaengine/funda-ai/guidepoint查二手引述。"
