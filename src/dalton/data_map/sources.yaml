# Dalton 数据源说明清单（按来源 id 维护）
# 供 src/dalton/data_map/builder.py 与研究库 catalog、体检状态、对话归档统计合并渲染。
# 若研究库 catalog 中新增了此处未登记的路由（且不在 handoff_routes 过滤名单中），构建器会自动列出并标注“未写说明”。

handoff_filtered_routes:
  - web-news
  - web-page
  - filings
  - agent-reach
  - x-search

catalog_routes:
  all:
    category: research
    title: 跨库初筛
    rules: "四库+AE+GP,不含transcript"
    description: "四库+卖方/专家联搜，不确定资料在哪时初筛。"
  alphaengine:
    category: research
    title: 卖方研报
    rules: "search_library后get_document"
    description: "卖方研报/纪要/目标价，查大行观点与分歧。"
  guidepoint:
    category: research
    title: 专家访谈
    rules: "匿名引职务,原话≤20词"
    description: "供应链/渠道/竞品专家访谈，查产业景气与格局。"
  transcript:
    category: research
    title: 业绩会转写
    rules: "all不含,须单调"
    description: "财报电话会与回访全文，核对管理层原话、指引与Q&A。"
  company-wiki:
    category: research
    title: 公司资料库
    rules: "只读;params.company=TICKER"
    description: "已入库公司笔记与行业沉淀，调取标的背景。"
  sales-notes:
    category: research
    title: 销售邮件
    rules: "raw独立源/digest线索"
    description: "交易台反馈、bogey/whisper与早报，查催化与资金。"
  tmtb:
    category: research
    title: TMT总结
    rules: "转述与原件计同源"
    description: "TMT收盘总结与盘前盘后复盘，查科技股涨跌原因。"
  funda-ai:
    category: research
    title: FUNDA AI
    rules: "先search再read"
    description: "FUNDA AI拆解与高频图，查AI算力与科技跟踪。"
  sec:
    category: finance
    title: 美股SEC
    rules: "10-K/10-Q/8-K/20-F/6-K"
    description: "美股SEC公告原文与报表，核实法定披露与附注。"
  estimates:
    category: finance
    title: 一致预期
    rules: "operation=consensus"
    description: "营收/EPS等一致预期快照，用于Beat/Miss对比。"
  cn-hk:
    category: finance
    title: 港A股财务公告
    rules: "operation=ask|filings|quote"
    description: "`filings` 覆盖 A 股和港股的法定公告（巨潮转载），港股约有 5% 的缺口，主要是仅英文版公告和股东大会投票结果，这类需要原文时，用 `web_search` 查 `site:hkexnews.hk`；港 A 股财务、估值、资金面（`ask`，公司和日期写进问题）；`quote` 仅作 `get_quote` 的备用报价。"
  fred:
    category: macro
    title: FRED宏观
    rules: "series+start+end必填"
    description: "美国通胀/就业/GDP/利率序列，查宏观与折现率。"
  treasury:
    category: macro
    title: TGA与联邦债务
    rules: "operation=treasury, dataset=tga|debt"
    description: "财政部TGA余额与联邦债务，查流动性；收益率走fred。"
  market-regime:
    category: macro
    title: 市场状态与拥挤度
    rules: "operation=snapshot|us_topbottom|crowding|cn_leverage"
    description: "大盘过热/超卖、顶部底部阶段、拥挤度、两融杠杆；回答大盘和仓位问题时先读"
  xueqiu:
    category: community
    title: 雪球讨论
    rules: "posts/post/comments/search/user,pages≤3"
    description: "港A股与中概散户及KOL观点。"
  employee:
    category: community
    title: 员工评论
    rules: "blind/summary免费;付费须allow_paid=True"
    description: "员工侧情绪与组织变化。"
  last30days:
    category: community
    title: 跨平台社区情绪
    rules: "query+days≤30"
    description: "跨平台与StockTwits/Polymarket情绪。"
  x-timeline:
    category: community
    title: X固定账号时间线
    rules: "tweets/tweet/thread/search,count≤100;与x_search按原帖URL去重"
    description: "固定账号建不漏底表；跨账号观点与媒体补充用x_search。"

direct_tools:
  conversation_search:
    category: memory
    title: 团队对话归档
    call: "conversation_search"
    description: "团队过往事实、预测、假设、观点、问题、决定、待办卡片及原话，查既有看法并对比变化。"
  web_search:
    category: web
    title: 全网新闻
    call: "web_search"
    description: "公开媒体报道、突发新闻与监管动态，查盘前盘后催化与公开事件。"
  x_search:
    category: social
    title: X社媒检索
    call: "x_search"
    description: "X实时讨论、管理层/KOL发言与第一反应(只引带链接帖)，查情绪与传闻。"
  market_quotes:
    category: market
    title: 行情与K线
    call: "get_quote/get_daily_prices/get_market_overview"
    description: "美/港/A股及指数报价与日K；期货/大宗(NQ=F、ES=F、CL=F、GC=F)、^TNX与VIX(延迟15分)；extended_hours=True含美股盘外分时。"
  company_options_screener:
    category: market
    title: 公司与期权选股
    call: "get_company_overview/get_options_chain/screen_stocks"
    description: "公司基本面快照、美股期权链及选股，用于公司画像与期权波动。"
  sec_filings:
    category: filing
    title: SEC XBRL与报表
    call: "dalton_sec/get_sec_filing"
    description: "美股归一化XBRL财务事实(含重述)及报表原文，用于建模与核对。"

unavailable_sources:
  - id: futures_realtime
    title: 期货与大宗商品实时(非延迟)行情
    note: "yfinance期货延迟约15分钟，注明延迟。"
  - id: institutional_13f_flow
    title: 13F持仓与暗池/期权异动流
    note: "未接通(静态期权链用get_options_chain)。"
  - id: alt_data
    title: 高频另类数据(信用卡/SensorTower/卫星/海关)
    note: "未接直连，仅从alphaengine/funda-ai/guidepoint查二手引述。"
