# Dalton on LangAlpha behavioral defaults (P0.1, P0.8, PK §0.5, P0N.1, P0N.5, P0G)
enabled: true
timezone: "Asia/Shanghai"

credentials:
  sharing: team

colleague_dispatch:
  enabled: false

# 电脑 CLI token（上游 #656：`la` 在电脑沙箱里调用 API 用的 lac1.* token）。
# 默认关闭。关闭时三处拦截（hook：computer-cli-tokens-off）：cli_tokens.keep()
# 不写 token 文件、不写 computer_cli_tokens 行；CliTokenSweeper 不启动、
# sweep_once 在 _prune_calls/claim_due 之前就返回；get_principal 的 lac1 分支
# 直接 401。从开改成关时按运维约定跑一次 scripts/dalton/revoke_computer_cli_tokens.py。
computer_cli_tokens:
  enabled: false

# artifact 发布、版本和划词评论（上游 #666）。代码默认 false；生产配置设为
# true（用户 11-03 决定开放），开关留作应急关闭。关闭时七处拦截（hook：
# artifact-publishing-off）：publish 与 set keep_updated=True 403、bind 403、
# 评论写接口 403、带 artifact_comment_ids 的发送 409（messaging 构造流式响应
# 之前，ptc_run 再留一道）、keep_updated_after_turn 直接返回、agent 不注册
# reply_to_comment。旧链接的读取、撤销和 legacy 首读转换保留。切换开关改变
# 主 agent 工具列表，按部署变更处理并重录请求锁（§11）。
artifact_publishing:
  enabled: false

# 覆盖单元登记表（d023，行业层 P0）。默认关闭：关闭时工作区覆盖身份只走兼容
# 规则（公司知识文档 → 隐式公司；Home → 无单元；其余 → 未分类），不读
# dalton_coverage_units 表；打开后，绑定到工作区的 active 单元优先于兼容规则。
coverage_units:
  enabled: false

network:
  # The host proxy runs in fake-IP mode: inside the backend container DNS answers
  # every public host with an address in 198.18.0.0/15 (benchmarking space, which
  # Python classes as private). The in-house fetch guard lets exactly these ranges
  # through; an entry overlapping RFC1918, loopback, link-local or ULA is dropped
  # with an error log.
  fake_ip_cidrs: ["198.18.0.0/15"]
  # A fake-IP hides where the proxy will really connect, so for a fake-IP answer
  # the guard also looks up the host's real A/AAAA records over DNS-over-HTTPS
  # (JSON API, tried in order, 3s timeout) and blocks if any is private or the
  # lookup fails.
  fake_ip_real_resolver:
    - "https://1.1.1.1/dns-query"
    - "https://dns.google/resolve"

models:
  broker:
    enabled: true            # OpenClaw broker v2 parallel path; false hides ocb-* from catalog
  disabled_providers: []     # Provider kill switch (P0N.8, L17). Example: ["muse-oauth"]
  # Single source of truth for Dalton auxiliary task (assist) model defaults
  # (agent_config.dalton.yaml no longer defines llm.assist).
  assist_model: "gemini-3.8-flash-low-oauth"
  # Must sit outside every reviewer family (role_policy L20), hence not Gemini/GPT/Grok/Claude.
  assist_fallback_model:
    - "deepseek-flash"
  probe_models:
    claude-oauth: "claude-sonnet-5-5-oauth"
    codex-oauth: "gpt-6.1-sol-oauth"
    antigravity-oauth: "gemini-3.8-flash-low-oauth"
    muse-oauth: "muse-spark-1.3-oauth"
    xai-oauth: "grok-4.7-oauth"
    z-ai-cn-coding: "glm-5.3-flash-plan"
    xai: "grok-4.3"
    deepseek: "deepseek-flash"
    z-ai: "glm-5.3-flash"
    openai: "gpt-6-luna"
    gemini: "gemini-3-flash"

budget:
  # Default daily cap USD when user has not saved a DB row yet (null = fail-closed,
  # "未设置日预算"). 100 matches the owner's own cap, so team members who never opened
  # Settings -> Dalton Budget are not refused at $0 before any model call.
  default_daily_cap_usd: 100
  default_task_cap_usd: null
  reserve_chunk_usd: 1.00
  admission_floor_usd: 0.25
  lease_ttl_seconds: 300
  timezone: "Asia/Shanghai"

knowledge:
  max_doc_bytes: 1048576

mandate:
  long_hurdle_annual: 0.15        # 多头年化要求回报
  short_hurdle_annual: 0.20       # 空头年化要求跌幅
  min_total_return: 0.10          # 多头短周期最低绝对回报（见 4.2）
  max_adverse_move_act_now: 0.25  # act_now 时不利端点最大不利幅度（§12.1 / §12.4）
  call_hurdle_annual: 0.15        # call 要求年化门槛
  anchor_stale_days: 14           # 锚价天数过期阈值（§12.8）
  anchor_stale_move: 0.15         # 锚价偏离过期阈值（§12.8）

publish:
  reviewer_models:
    - "gpt-6.1-sol-oauth"
    - "gemini-4-argon-high-oauth"
    - "grok-4.7-oauth"
    - "claude-opus-5-5-oauth"
  # Number audit (check_draft / publish). Measured on a 48k-character initial
  # coverage draft (27 batches): argon-medium 139s with no failed batch and the
  # best agreement with the other two; the OpenClaw-relayed 3.8 flash failed 24.
  audit_model: "gemini-4-argon-medium-oauth"
  # Language review (check_language). Empty = fall back to audit_model above, so
  # the effective default stays argon-medium without repeating the key here.
  language_model: ""
  audit_fallback_models:
    - "gpt-6.1-sol-oauth"
    - "claude-opus-5-5-oauth"
  audit_timeout_s: 300
  audit_concurrency: 4
  audit_total_timeout_s: 1800
  approval_ttl_hours: 168
  max_file_bytes: 20971520
  consensus_providers:
    - "estimates:"
    - "yf_analysis"

autonomy:
  enabled: true
  min_wake_usd: 0.50
  event_reserve_ratio: 0.2
  preflight_timeout_s: 45
  data_health_timeout_s: 600
  backoff:
    base_hours: 24
    max_days: 30
  vendor_quota_alert_ratio: 0.8

conversations:
  enabled: true
  # 2026-10-23 盲评中忠实度和覆盖度最高
  extractor_model: "deepseek-flash"
  extractor_fallback_model: "gemini-4-argon-medium-oauth"
  segment_deadline_s: 600
  prompt_version: "conv_card_v2_3"
  embedding_model: "gemini-embedding-001"
  embedding_model_preferred: "gemini-embedding-2-preview"
  embedding_dimensions: 3072
  # 10/26 user decision: 5M/h. At 120k/h a backlog of ~75 segments (about 20k tokens
  # each) took 10+ hours; deepseek-flash costs about $0.016 per segment, so 5M/h is at
  # most a few dollars an hour.
  hourly_token_budget: 5000000
  extract_concurrency: 1
  default_backfill_days: 14
  max_segment_gap_minutes: 30
  max_segment_chars: 6000
  max_segment_events: 25
  rate_limit_initial_backoff_seconds: 30.0
  rate_limit_max_backoff_seconds: 900.0
  recency_half_life_days: 180.0
  recency_floor: 0.7
  inbox_dir: "var/dalton/conversations/inbox"
  cursors_file: "var/dalton/conversations/cursors.json"
  export_cursors_file: "var/dalton/conversations/export_cursors.json"
  agents:
    - "main"
    - "chem"
    - "marco"
