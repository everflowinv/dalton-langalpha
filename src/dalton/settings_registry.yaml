    cos: excluded:管理员专用模型供应商变体与路由配置
    profiles: [everflow, core]
    routes:
      - PUT /api/v1/dalton/team-models/provider-variants/{provider_slug}

  - key: dalton.team_models.curated
    stored_in: dalton_team_model_curated_setup
    web_entry: 设置 → 团队管理 → 模型与供应商 → 团队模型目录（入门推荐模型）
    cos: excluded:管理员专用入门推荐模型列表配置
    profiles: [everflow, core]
    routes:
      - PUT /api/v1/dalton/team-models/curated

  - key: dalton.watchlist.tier_policy
    stored_in: dalton_watchlist_tier_policies（core / watch / radar 各档监控策略）
    web_entry: 设置 → 覆盖结构 → 各档监控策略
    cos: tool:dalton_coverage
    profiles: [everflow, core]
    routes:
      - PUT /api/v1/dalton/watchlist/tier-policies/{tier}

  - key: dalton.coverage_unit
    stored_in: dalton_coverage_units（行业/公司覆盖单元与工作区绑定）
    web_entry: 设置 → 覆盖结构 → 团队覆盖结构
    cos: tool:dalton_coverage_unit
    profiles: [everflow]
    capability: colleague_sharing

  - key: dalton.system_jobs
    stored_in: dalton_data_task_defs（公司公共数据任务定时排期与启停开关）
    web_entry: 设置 → 团队管理 → 团队渠道与运维 → 自动巡检与团队公共任务（及自动化 → 公司公共任务）
    cos: tool:dalton_system_jobs
    profiles: [everflow]
    capability: data_jobs

  - key: dalton.monitors.settings
    stored_in: dalton_monitors（标题、可见范围与发布设置）
    web_entry: 侧栏「监控面板」→ 面板设置
    cos: tool:dalton_monitor
    profiles: [everflow, core]
    routes:
      - PATCH /api/v1/dalton/monitors/{slug}

  - key: dalton.monitors.shared_document
    stored_in: dalton_monitors（工作区分享文档元数据与可见范围）
    web_entry: 工作区文件发布/分享面板
    cos: excluded:公开与团队分享文档可见范围边界，须由用户在分享面板操作
    profiles: [everflow, core]
    routes:
      - PATCH /api/v1/dalton/monitors/shared-documents/by-artifact/{artifact_id}

  # ===========================================================================
  # 9. 渠道与外部集成（channels / integrations）
  # ===========================================================================
  - key: channels.settings
    stored_in: dalton_channel_user_settings（default / chats / preferred / automation_output / agent_messages）
    web_entry: 设置 → 消息与渠道（默认工作区、首选会话、自动化输出与允许主动发送的群）
    cos: tool:edit_file(.agents/user/channels/channels.json)
    profiles: [everflow]
    capability: channel_gateway
    routes:
      - PUT /api/v1/dalton/channels/settings
      - PUT /api/v1/dalton/channels/internal/settings

  - key: channels.weixin.admin_config
    stored_in: dalton_weixin_channel_config（enabled / allow_external）
    web_entry: 设置 → 团队管理 → 团队渠道与运维 → 团队微信渠道管理
    cos: excluded:管理员专用团队微信接入开关与外部成员接入策略
    profiles: [everflow]
    capability: channel_weixin
    routes:
      - PUT /api/v1/dalton/channels/weixin/admin/config

  - key: channels.weixin.binding
    stored_in: dalton_weixin_accounts（个人微信 iLink 扫码绑定与登录态）
    web_entry: 设置 → 消息与渠道 → 我的微信绑定
    cos: excluded:涉及个人微信扫码鉴权与会话令牌，须由本人在网页端扫码绑定或解绑
    profiles: [everflow]
    capability: channel_weixin

  - key: channels.feishu_discord.binding
    stored_in: dalton_channel_bindings（飞书与 Discord 个人账号绑定）
    web_entry: 设置 → 消息与渠道 → 飞书与 Discord 账号绑定
    cos: excluded:涉及绑定码身份核验与账号解绑，须由本人在网页端完成
    profiles: [everflow]
    capability: channel_gateway

  - key: channels.feishu.groups
    stored_in: dalton_channel_feishu_groups（团队飞书群绑定与报告接收权限）
    web_entry: 设置 → 团队管理 → 团队渠道与运维 → 飞书团队群
    cos: excluded:团队共享群绑定管理，由内部成员或管理员在网页端维护
    profiles: [everflow]
    capability: channel_feishu

  - key: channels.discord.channels
    stored_in: dalton_channel_discord_channels（团队 Discord 频道绑定与报告接收权限）
    web_entry: 设置 → 团队管理 → 团队渠道与运维 → Discord 频道
    cos: excluded:管理员专用团队 Discord 频道绑定配置
    profiles: [everflow]
    capability: channel_discord

  - key: integrations.trading_permission
    stored_in: user_trading_permissions（Dalton 构建锁定为 no_trading）
    web_entry: 当前版本不开放交易权限设置页
    cos: excluded:涉及实盘交易自动下单授权协议且当前版本禁用，严禁智能体修改
    profiles: [everflow, core]

  - key: integrations.user_api_keys
    stored_in: user_api_keys（加密存储）
    web_entry: 设置 → 模型 → 模型访问（自带 API Key）
    cos: excluded:用户私有 API 密钥凭据，禁止经对话上下文读写
    profiles: [everflow, core]

  - key: integrations.user_oauth_tokens
    stored_in: user_oauth_tokens（加密存储）
    web_entry: 设置 → 模型 → 模型访问（订阅账号 OAuth 登录）
    cos: excluded:第三方账号 OAuth 登录凭据，须由本人在浏览器完成授权
    profiles: [everflow, core]

  - key: integrations.vault_secrets
    stored_in: user_vault_secrets（加密存储）
    web_entry: 侧栏「插件」→ 密钥（Vault）
    cos: excluded:敏感密钥保管库，禁止智能体通过对话工具写入或导出
    profiles: [everflow, core]

  - key: integrations.mcp_servers
    stored_in: user_mcp_servers / workspace_mcp_servers
    web_entry: 侧栏「插件」→ 连接器（以及工作区 Sandbox Settings → MCP）
    cos: excluded:涉及外部 MCP 端点 URL、认证头与命令执行权限，由用户在插件页管理
    profiles: [everflow, core]

  - key: integrations.plugins
    stored_in: user_plugins
    web_entry: 侧栏「插件」→ 插件启停与安装
    cos: excluded:账户级插件安装与启用状态，由用户在插件页管理
    profiles: [everflow, core]

  - key: integrations.skills
    stored_in: user_skills
    web_entry: 侧栏「插件」→ 技能（以及工作区 Sandbox Settings → Skills）
    cos: excluded:账户与工作区技能安装及启停，由用户在插件页或沙箱面板管理
    profiles: [everflow, core]

  - key: integrations.subagents
    stored_in: user_subagents（.agents/user/agents/*.md）
    web_entry: 侧栏「插件」→ 子 Agent
    cos: tool:edit_file(.agents/user/agents/*.md)
    profiles: [everflow, core]

