# Dalton 用户可调设置登记表（Chief of Staff 能力守卫清单）
#
# 本文件专供开发期与守卫测试（tests/unit/dalton/test_settings_registry.py）使用。
# 新增或调整用户可调设置时，在此登记并写明研究总监（Chief of Staff）的处理方式：
# - tool:<工具名或虚拟文件>  已支持通过研究总监工具或虚拟数据文件修改
# - missing                  计划由研究总监支持修改，当前待补充工具
# - excluded:<原因>          由网页端、服务端或管理员维护（如凭据、账单/预算、管理员配置、安全授权、设备本地或界面视觉偏好）
#
# 形态（profiles）取值来自 src.dalton.profile.DeploymentProfile（everflow / core）；
# 能力门控（capability）取值来自 src.dalton.capabilities.CapabilityId；
# route_fields 列出对应 Dalton PUT/PATCH 接口 Pydantic 请求体（含嵌套模型与 model_validate 校验模型）中由本条目覆盖的可写字段；
# schema_fields 列出前端 other_preference 子模式（Zod）中由本条目覆盖的可校验子字段路径。

version: 1

settings:
  # ===========================================================================
  # 1. 用户资料（users 表，UserUpdate）与设备本地通用偏好
  # ===========================================================================
  - key: user.name
    stored_in: users.name
    web_entry: 设置 → 个人资料 → 姓名
    cos: tool:edit_file(.agents/user/profile/user.json)
    profiles: [everflow, core]

  - key: user.timezone
    stored_in: users.timezone
    web_entry: 设置 → 通用与外观 → 时区
    cos: tool:edit_file(.agents/user/profile/user.json)
    profiles: [everflow, core]

  - key: user.locale
    stored_in: users.locale
    web_entry: 设置 → 通用与外观 → 语言
    cos: tool:edit_file(.agents/user/profile/user.json)
    profiles: [everflow, core]

  - key: user.onboarding_completed
    stored_in: users.onboarding_completed
    web_entry: 首次登录引导流程（系统自动更新）
    cos: tool:edit_file(.agents/user/profile/user.json)
    profiles: [everflow, core]

  - key: user.email
    stored_in: users.email
    web_entry: 设置 → 个人资料 → 邮箱（Dalton 认证模式下只读）
    cos: excluded:账号登录标识，由认证体系维护
    profiles: [everflow, core]

  - key: user.avatar_url
    stored_in: users.avatar_url
    web_entry: 设置 → 个人资料 → 头像
    cos: excluded:需通过浏览器上传头像图片文件，由用户在设置页操作
    profiles: [everflow, core]

  - key: user.personalization_completed
    stored_in: users.personalization_completed
    web_entry: 个人资料访谈引导（系统流程标记）
    cos: excluded:引导流程内部状态标记，由引导流程自动维护
    profiles: [everflow, core]

  - key: user.computer_choice
    stored_in: users.computer_choice
    web_entry: 桌面端首次启动引导（选择云端或本机运行）
    cos: excluded:运行宿主架构选择，涉及本机配对流程，由用户在端上选择
    profiles: [everflow, core]

  - key: user.font_size
    stored_in: 浏览器 localStorage（fontScale，仅限当前设备）
    web_entry: 设置 → 通用与外观 → 字体大小
    cos: excluded:设备本地显示比例，仅保存在当前设备
    profiles: [everflow, core]

  - key: user.share_link_open
    stored_in: 浏览器 localStorage（shareLinkOpen，仅限当前设备）
    web_entry: 设置 → 通用与外观 → 桌面端打开 /a/ 分享链接方式
    cos: excluded:设备本地链接打开方式偏好，仅保存在当前设备
    profiles: [everflow, core]

