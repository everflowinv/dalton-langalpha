#   {today}, {market_sh_sz}, {board_name}, {indicator_annual_quarterly}

# ============== Existing Intents (migrated from if-else) ==============

- id: fund_flow_individual
  keywords: [资金流, 资金流向, 主力资金, 净流入, 净流出, 大单, 散户资金, 主力在买吗, 谁在买, 主力动向, 资金进出, 主力净额]
  function: stock_individual_fund_flow
  needs_ticker: true
  args:
    stock: "{ticker6}"
    market: "{market_sh_sz}"
  description: 个股资金流向(主力/散户/大单净流入)
  fallbacks:
    - function: stock_fund_flow_individual
      source: ths
      args:
        symbol: "即时"
      post:
        filter_eq:
          股票代码: "{ticker6}"
