# =============================================================================
# DALTON AGENT CONFIGURATION OVERLAY (APP_ENV=dalton)
# =============================================================================
# Applied over agent_config.yaml when APP_ENV=dalton.

llm:
  # Defaults for anyone without a saved model preference: the owner's own choices, fallback
  # chain included. Model credentials are team-shared (credentials.sharing: team, #66), so
  # the owner's *-oauth connections serve every member.
  name: "claude-opus-5-5-oauth"
  background: "gemini-4-argon-low-oauth"
  # Assist (auxiliary JSON task) model defaults live in src/dalton/dalton.yaml
  # under models.assist_model / models.assist_fallback_model (not here).
  compaction: ""
  fetch: ""
  fallback:
    - "gemini-4-argon-high-oauth"
    - "muse-wonder-1.0-oauth"
    - "gpt-6.1-sol-oauth"

sandbox:
  provider: "docker"
  # Product decision 2 (roadmap §6): SSH computers, the SSH gateway and user
  # SSH keys stay closed in Dalton — code merged, entry off. `offered_providers`
  # is the one switch both the create API (`kind not in creatable_providers()`
  # → 400) and the provider picker (`GET /computers/providers`) read; with it
  # empty only Docker exists. The gateway itself runs only where
  # SSH_GATEWAY_ADDRESS is set, which Dalton does not set.
  offered_providers: []
  docker:
    memory_limit: "3g"
    cpu_count: 2.0
    # Product decision 7/12: keep `max` at 4 vCPU (and 4 code slots) so existing
    # `max` computers are never downsized by upstream #604's 4 -> 2 vCPU reduction.
    resource_tiers:
      standard:
        cpu: 1
        memory: 2
        disk: 5
      performance:
        cpu: 2
        memory: 4
        disk: 10
      max:
        cpu: 4
        memory: 8
        disk: 10
      xlarge:
        cpu: 4
        memory: 8
        disk: 20
  daytona:
    # Used by WorkspaceManager to derive idle auto-stop threshold (2400 - 600 = 1800s = 30 min)
    auto_stop_interval: 2400
    resource_tiers:
      standard:
        cpu: 1
        memory: 2
        disk: 5
      performance:
        cpu: 2
        memory: 4
        disk: 10
      max:
        cpu: 4
        memory: 8
        disk: 10

mcp:
  servers:
    - name: "price_data"
      enabled: true
    - name: "researchdata"
      call_timeout_s: 625

subagents:
  definitions:
    research:
      model: "grok-4.7-oauth"
    data-prep:
      model: "grok-4.7-oauth"
    general-purpose:
      model: "grok-4.7-oauth"

search_api: "openclaw"

# Fetch falls through the chain per URL: in-house first; Firecrawl only for the
# URLs in-house could not fetch (403, anti-bot, JS-only pages). Firecrawl bills
# per call and shares the OpenClaw account, so it stays second.
fetch_chain: ["inhouse", "firecrawl"]
