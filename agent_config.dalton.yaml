# =============================================================================
# DALTON AGENT CONFIGURATION OVERLAY (APP_ENV=dalton)
# =============================================================================
# Applied over agent_config.yaml when APP_ENV=dalton.

llm:
  # Defaults for anyone without a saved model preference: the owner's own choices, fallback
  # chain included. Model credentials are team-shared (credentials.sharing: team, #66), so
  # the owner's *-oauth connections serve every member.
  name: "claude-opus-5-5-oauth"
  background: "gemini-4-argon-low-oauth"
  # Assist (auxiliary JSON task) model defaults live in src/dalton/dalton.yaml
  # under models.assist_model / models.assist_fallback_model (not here).
  compaction: ""
  fetch: ""
  fallback:
    - "gemini-4-argon-high-oauth"
    - "muse-wonder-1.0-oauth"
    - "gpt-6.1-sol-oauth"

sandbox:
  provider: "docker"
  docker:
    memory_limit: "3g"
    cpu_count: 2.0
  daytona:
    # Used by WorkspaceManager to derive idle auto-stop threshold (2400 - 600 = 1800s = 30 min)
    auto_stop_interval: 2400

mcp:
  servers:
    - name: "price_data"
      enabled: true
    - name: "researchdata"
      call_timeout_s: 625

subagents:
  definitions:
    research:
      model: "grok-4.7-oauth"
    data-prep:
      model: "grok-4.7-oauth"
    general-purpose:
      model: "grok-4.7-oauth"

search_api: "openclaw"

# Fetch falls through the chain per URL: in-house first; Firecrawl only for the
# URLs in-house could not fetch (403, anti-bot, JS-only pages). Firecrawl bills
# per call and shares the OpenClaw account, so it stays second.
fetch_chain: ["inhouse", "firecrawl"]
