# =============================================================================
# DALTON AGENT CONFIGURATION OVERLAY (APP_ENV=dalton)
# =============================================================================
# Applied over agent_config.yaml when APP_ENV=dalton.

llm:
  # Defaults for anyone without a saved model preference (the team accounts hold no personal
  # OAuth/BYOK credentials), so they go through the shared OpenClaw broker (ocb-*), which any
  # signed-in user may use. Personal-OAuth models (*-oauth) stay available to whoever connected them.
  name: "ocb-openai-gpt-6-astra"
  background: "deepseek-flash"
  assist: "ocb-google-gemini-3.8-flash"
  compaction: ""
  fetch: ""
  fallback:
    - "ocb-google-gemini-4-argon"

sandbox:
  provider: "docker"
  docker:
    memory_limit: "3g"
    cpu_count: 2.0
  daytona:
    # Used by WorkspaceManager to derive idle auto-stop threshold (2400 - 600 = 1800s = 30 min)
    auto_stop_interval: 2400

mcp:
  servers:
    - name: "price_data"
      enabled: true
    - name: "researchdata"
      call_timeout_s: 625

subagents:
  definitions:
    research:
      model: "ocb-xai-grok-4.7"
    data-prep:
      model: "ocb-xai-grok-4.7"
    general-purpose:
      model: "ocb-xai-grok-4.7"

search_api: "openclaw"
