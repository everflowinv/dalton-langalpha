# DALTON MARKET-DATA CHAIN OVERLAY (APP_ENV=dalton)
# Applied over config.yaml when APP_ENV=dalton (src/ptc_agent/config/file_utils.py:
# lists replace outright, so this is the complete market_data.providers table).
# User decision 2026-10-24: free yfinance answers ahead of FMP wherever both can
# serve, so FMP's ~250 calls/day free quota survives for what only FMP has.
# Everything except the yfinance/fmp ordering matches upstream config.yaml.
market_data:
  providers:
    - name: ginlix-data
      markets: [us]          # US equities only
    - name: tushare
      markets: [cn]          # A-share daily bars (qfq-adjusted), served by ginlix-data
      intraday_markets: []   # ginlix-data's minute history is short, so intraday
                             # stays on the fallbacks; the probe ruleset
                             # (data_routing.yaml) can override this
      snapshot_markets: [cn] # realtime A-share quotes (equities; indices/ETFs
                             # fall through)
    - name: yfinance
      markets: []                 # priority slot: non-US intraday only —
      intraday_markets: [non-us]  # native session anchors incl. lunch gaps
    - name: yfinance
      markets: [all]         # Free fallback — no API key, ahead of FMP
    - name: fmp
      markets: [all]         # FMP — global coverage, catch-all fallback

# Ordered news provider chain — yfinance ahead of FMP so user-initiated news
# queries prefer free sources before consuming FMP's daily quota (background
# polling in NewsRefreshService excludes FMP altogether).
news_data:
  providers:
    - name: ginlix-data
    - name: yfinance
    - name: fmp

# Background subagent concurrency caps (per thread and across all backend workers).
subagent_limits:
  max_running_per_thread: 8
  max_running_global: 24

# Product decision 1b (roadmap §6): keep Dalton's stock-move automations
# (src/dalton/autonomy/price_trigger.py) and do not open upstream's
# market-watch price targets. The kill switch unbinds the watch_market tool
# from the agent, hides every watch/target surface (the base watch toggle
# included), and drops delivery of any notice an existing armed target still
# produces. Flip to true if/when the product decision opens the feature.
features:
  market_watch:
    enabled: false
  # Product decision 1 (roadmap §6): upstream's wakeups (schedule_wakeup,
  # cron/price/order wakes that can start a turn of their own on an idle
  # thread) stay off until the budget/governance review opens them. The kill
  # switch unbinds the schedule_wakeup tool, hides the chat-tray chip and the
  # Status-panel tab, and makes the wake delivery drop every notice, so no
  # path starts a turn on an idle thread. Wake delivery, once enabled, rides
  # the normal messaging admission (enforce_credit_limit), which the Dalton
  # budget-admission hook gates. Flip to true when the decision opens it.
  wakeups:
    enabled: false
  # SYNC2 decision 13 (#643): upstream's Claude Code runtime merges but stays
  # off. The kill switch keeps the feature flag dark for every user (the code
  # default is off with an opt-in gate, so this also pins it against a future
  # catalog default flip), the production image never installs the
  # claude-code extra, and desktop/SSH/E2B stay closed to it. Nothing reads
  # the flag until Claude Code models are routable; flip to true only with
  # the operator decision that opens those surfaces.
  claude_code_runtime:
    enabled: false

