# Standalone Core TLS port overlay (DALTON_TLS_MODE=internal | auto | custom).
#
# Loopback HTTP mode (default) uses docker-compose.yml + docker-compose.core.yml
# alone and publishes only 127.0.0.1:${DALTON_EDGE_PORT:-8088}. Include this
# overlay whenever HTTPS is enabled on IPv4 loopback (for IPv6 loopback ::1,
# use deploy/standalone/docker-compose.tls.ipv6.yml).
#
# Before Batch 4b ships local sign-in, the bind address is hardcoded to
# 127.0.0.1 with NO environment-variable interpolation so no env override can
# publish a passwordless instance externally. Batch 4b will make this configurable.
services:
  edge:
    ports: !override
      - "127.0.0.1:${DALTON_EDGE_HTTP_PORT:-18080}:80"
      - "127.0.0.1:${DALTON_EDGE_HTTPS_PORT:-18443}:443"
