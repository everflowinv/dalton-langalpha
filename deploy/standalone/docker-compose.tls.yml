# Standalone Core TLS port overlay (DALTON_TLS_MODE=internal | auto | custom).
#
# Loopback HTTP mode (default) uses docker-compose.yml + docker-compose.core.yml
# alone and publishes only 127.0.0.1:${DALTON_EDGE_PORT:-8088}. Include this
# overlay whenever HTTPS is enabled on IPv4 (for IPv6 hosts, use
# deploy/standalone/docker-compose.tls.ipv6.yml).
#
# DALTON_EDGE_TLS_BIND is written to .env by scripts/standalone/init.sh based on
# DOMAIN: loopback hosts stay bound to 127.0.0.1, and non-loopback addresses
# (such as 0.0.0.0) are written only when local sign-in (DALTON_AUTH_MODE=local)
# is enabled. Backend startup also refuses non-loopback bind addresses unless
# DALTON_AUTH_MODE=local.
services:
  edge:
    ports: !override
      - "${DALTON_EDGE_TLS_BIND:-127.0.0.1}:${DALTON_EDGE_HTTP_PORT:-18080}:80"
      - "${DALTON_EDGE_TLS_BIND:-127.0.0.1}:${DALTON_EDGE_HTTPS_PORT:-18443}:443"
