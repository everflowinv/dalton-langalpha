# Standalone Core IPv6 loopback TLS port overlay (DOMAIN=::1, DALTON_TLS_MODE=internal | auto | custom).
#
# Before Batch 4b ships local sign-in, the bind address is hardcoded to [::1]
# with NO environment-variable interpolation so no env override can publish a
# passwordless instance externally. Batch 4b will make this configurable.
services:
  edge:
    ports: !override
      - "[::1]:${DALTON_EDGE_HTTP_PORT:-18080}:80"
      - "[::1]:${DALTON_EDGE_HTTPS_PORT:-18443}:443"
