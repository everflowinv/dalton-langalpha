# Standalone Core IPv6 TLS port overlay (IPv6 DOMAIN, DALTON_TLS_MODE=internal | auto | custom).
#
# DALTON_EDGE_TLS_BIND is written to .env by scripts/standalone/init.sh based on
# DOMAIN: loopback hosts stay bound to [::1], and non-loopback addresses (such as
# [::]) are written only when local sign-in (DALTON_AUTH_MODE=local) is enabled.
# Backend startup also refuses non-loopback bind addresses unless
# DALTON_AUTH_MODE=local.
#
# Convention: IPv6 addresses in .env use square brackets (e.g. [::1] or [::]) so
# Docker Compose port strings interpolate directly without adding brackets here.
services:
  edge:
    ports: !override
      - "${DALTON_EDGE_TLS_BIND:-[::1]}:${DALTON_EDGE_HTTP_PORT:-18080}:80"
      - "${DALTON_EDGE_TLS_BIND:-[::1]}:${DALTON_EDGE_HTTPS_PORT:-18443}:443"
