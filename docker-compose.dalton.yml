services:
  postgres:
    build:
      context: .
      dockerfile: scripts/dalton/Dockerfile.postgres
    image: dalton-postgres:18-pgvector

  backend:
    # default for everything it already talks to; crawl for the crawler service.
    networks:
      - default
      - crawl
    build:
      context: .
      dockerfile: scripts/dalton/Dockerfile.dalton
      args:
        BUILD_GIT_SHA: ${BUILD_GIT_SHA:-}
        BUILD_GIT_DIRTY: ${BUILD_GIT_DIRTY:-}
    # sync3 B9 (#656): upstream's backend waits on the `cli` build service
    # (`service_completed_successfully`); Dalton does not build or ship the
    # `la` CLI, and the service below is parked on a profile nothing enables,
    # so the inherited dependency is reset to nothing.
    depends_on: !reset []
    entrypoint: ["/usr/bin/tini", "-s", "--", "/app/scripts/dalton/docker_entrypoint_dalton.sh"]
    # No --reload: src is bind-mounted, so with it a git pull on the deploy checkout restarts
    # the backend and cancels every running turn. Code changes are applied by an explicit
    # `docker restart dalton-langalpha-backend-1` once no turn is in progress.
    command: ["uv", "run", "python", "server.py", "--host", "0.0.0.0", "--port", "8000"]
    # 4g: raised from 3g for concurrent background subagents (up to 8 per thread /
    # 24 globally); the VM has 6 GB total and other containers use ~0.6 GB combined,
    # plus scrapling's Chromium runs inside this container next to the server.
    mem_limit: 4g
    # Chromium (scrapling's browser tier) crashes pages ("Page crashed", then a dead
    # driver pipe) with Docker's default 64 MB /dev/shm, which hung the whole backend.
    shm_size: "1gb"
    memswap_limit: 4g
    # Replace upstream 0.0.0.0:8000 port binding with loopback-only (requires Docker Compose v2.24.4+).
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # Inject DALTON_WEB_SEARCH_BRIDGE_TOKEN from the host 0600 env file without
    # writing the bridge token into repo .env or process arguments.
    env_file:
      - path: ${DALTON_WEB_SEARCH_BRIDGE_ENV_FILE:-${HOME}/.config/dalton/web-search-bridge.env}
        required: false
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/0"
      DALTON_WEB_SEARCH_BRIDGE_URL: "${DALTON_WEB_SEARCH_BRIDGE_URL:-http://host.docker.internal:8961}"
      # Sector layer (coverage units, P0–P5) on for this deployment; the code
      # default in src/dalton/dalton.yaml stays off. Set to 0 in the shell or
      # .env and recreate the backend to turn it back off.
      DALTON_COVERAGE_UNITS_ENABLED: "${DALTON_COVERAGE_UNITS_ENABLED:-1}"
      DALTON_HOST_VAR_DIR: "${DALTON_HOST_VAR_DIR:-${PWD}/var/dalton}"
    volumes:
      - ./agent_config.dalton.yaml:/app/agent_config.dalton.yaml:ro
      - ./config.dalton.yaml:/app/config.dalton.yaml:ro
      - ./workflows:/app/workflows:ro
      - ./config/dalton:/app/config/dalton:ro
      - ./var/dalton:/app/var/dalton
      # sync3 B9 (#656): a tmpfs over /app/cli replaces the inherited
      # `./cli:/app/cli:ro` bind (Compose merges service volumes by target, so
      # one long-syntax entry with the same target wins). Without it a
      # cli/dist/la.mjs built on the host would ride the bind into the
      # container and _shared.py would ship it into every sandbox. Must be the
      # long syntax here in `backend.volumes` — a service-level `tmpfs:` entry
      # fails with "target /app/cli already mounted".
      - type: tmpfs
        target: /app/cli

  # sync3 B9 (#656): upstream's one-shot `cli` build service, parked on a
  # profile nothing enables (`docker compose --profile cli-disabled` opts in
  # explicitly). Kept reachable rather than deleted so the inherited service
  # stays valid for anyone who wants the upstream behaviour.
  cli:
    profiles: ["cli-disabled"]

  # P6b: scrapling's browser tiers (Chromium/Camoufox) fetch here instead of
  # inside the 4 GB backend container, whose ceiling a runaway crawl could hit
  # (2026-10-31: browser tree ~3.2 GiB, container 4095.96/4096 MiB) and take
  # chat and streaming down with it. Same image as the backend (it carries
  # scrapling and the browsers); only the command differs. Reachable only on
  # the `crawl` network as http://crawler:8100 — no published ports; the
  # backend opts in via crawler.browser_service_url in agent_config.dalton.yaml
  # and fails the tier (never falls back in-process) when this service is down.
  # 2g hard cap sized on the 6 GB VM: browsers at ~0.4-0.9 GiB per crawl plus
  # worker overhead; a burst past it kills only crawls. pids_limit bounds a
  # fork-happy page; /dev/shm at 1gb because Chromium crashes pages on Docker's
  # default 64 MB. APP_ENV matches the backend's, so the same agent_config
  # overlay (and thus crawler.browser_concurrency) applies on both sides.
  crawler:
    # The backend's image, never built on its own: it carries scrapling and the
    # browsers, and the code comes from the bind mounts below. A separate build
    # would need the backend's BUILD_GIT_SHA args and could drift from it
    # (the 2026-11-01 P6b deploy failed exactly there).
    image: dalton-langalpha-backend
    # Not the backend entrypoint: no DB wait, no migrations — the service
    # touches neither Postgres nor Redis. tini still reaps what a killed crawl
    # worker leaves behind.
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command: ["uv", "run", "python", "-m", "src.dalton.crawl_service"]
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: "1gb"
    pids_limit: 512
    restart: unless-stopped
    # Only what the service reads — never the backend's whole .env: this
    # container renders untrusted pages in a browser, so it holds no API keys
    # or DB credentials. Both values interpolate from the project .env. The
    # token interpolates default-empty (a `:?` here would break every compose
    # command, `build backend` included, wherever the variable is unset); the
    # service logs an ERROR at startup and serves every /fetch 401 until it
    # is set.
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      APP_ENV: ${APP_ENV:-}
    # Code comes from the same bind mounts as the backend (whose image src is
    # only a fallback), so a deploy's git ff reaches both; read-only here.
    volumes:
      - ./src:/app/src:ro
      - ./mcp_servers:/app/mcp_servers:ro
      - ./agent_config.yaml:/app/agent_config.yaml:ro
      - ./agent_config.dalton.yaml:/app/agent_config.dalton.yaml:ro
    # Own network shared only with the backend: a compromised page cannot
    # reach Postgres, Redis or MinIO on the default network.
    networks:
      - crawl

  frontend:
    # Replace upstream 0.0.0.0:5173 port binding with loopback-only (requires Docker Compose v2.24.4+).
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Everflow}
      VITE_BRAND_MARK: ${VITE_BRAND_MARK:-everflow}
      # Supabase sign-in (docs/dalton/dev-guide/AUTH-DEPLOY.md); empty keeps the no-login local mode.
      VITE_DALTON_AUTH: ${VITE_DALTON_AUTH:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}

  edge:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${DALTON_EDGE_PORT:-8088}:8088"
    volumes:
      - ./deploy/dalton/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv:ro

  minio:
    profiles: ["storage"]
    # MinIO no longer publishes community images (Docker Hub / Quay refuse the
    # pull); Chainguard's free build is pinned by digest. A copy is saved with
    # `docker save` in the backups so a garbage-collected digest is recoverable.
    image: ${DALTON_MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7}
    # Require explicit root credentials when the `storage` profile starts MinIO,
    # without breaking `docker compose config` or non-storage services when unset.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${MINIO_ROOT_USER:-}" ] || [ -z "$${MINIO_ROOT_PASSWORD:-}" ]; then
          echo "ERROR: MINIO_ROOT_USER and MINIO_ROOT_PASSWORD (or STORAGE_ACCESS_KEY_ID / STORAGE_SECRET_ACCESS_KEY) must be set." >&2
          exit 1
        fi
        exec minio "$$@"
      - --
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    mem_limit: ${DALTON_MINIO_MEM_LIMIT:-512m}
    memswap_limit: ${DALTON_MINIO_MEM_LIMIT:-512m}
    ports:
      - "127.0.0.1:${DALTON_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${DALTON_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${STORAGE_ACCESS_KEY_ID:-}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${STORAGE_SECRET_ACCESS_KEY:-}}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-${DALTON_CORS_ALLOWED_ORIGINS:-}}
      MINIO_API_STALE_UPLOADS_EXPIRY: ${MINIO_API_STALE_UPLOADS_EXPIRY:-24h}
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: ${MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL:-6h}
    volumes:
      - dalton-minio-data:/data
    healthcheck:
      # The image has bash but no curl / wget / grep.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ \"$$line\" == *\" 200 \"* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  crawl: {}

volumes:
  dalton-minio-data:
