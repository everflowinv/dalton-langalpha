services:
  postgres:
    build:
      context: .
      dockerfile: scripts/dalton/Dockerfile.postgres
    image: dalton-postgres:18-pgvector

  backend:
    build:
      context: .
      dockerfile: scripts/dalton/Dockerfile.dalton
      args:
        BUILD_GIT_SHA: ${BUILD_GIT_SHA:-}
        BUILD_GIT_DIRTY: ${BUILD_GIT_DIRTY:-}
    entrypoint: ["/usr/bin/tini", "-s", "--", "/app/scripts/dalton/docker_entrypoint_dalton.sh"]
    # No --reload: src is bind-mounted, so with it a git pull on the deploy checkout restarts
    # the backend and cancels every running turn. Code changes are applied by an explicit
    # `docker restart dalton-langalpha-backend-1` once no turn is in progress.
    command: ["uv", "run", "python", "server.py", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 2g
    # Chromium (scrapling's browser tier) crashes pages ("Page crashed", then a dead
    # driver pipe) with Docker's default 64 MB /dev/shm, which hung the whole backend.
    shm_size: "1gb"
    memswap_limit: 2g
    # Replace upstream 0.0.0.0:8000 port binding with loopback-only (requires Docker Compose v2.24.4+).
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # Inject DALTON_WEB_SEARCH_BRIDGE_TOKEN from the host 0600 env file without
    # writing the bridge token into repo .env or process arguments.
    env_file:
      - path: ${DALTON_WEB_SEARCH_BRIDGE_ENV_FILE:-${HOME}/.config/dalton/web-search-bridge.env}
        required: false
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/0"
      DALTON_WEB_SEARCH_BRIDGE_URL: "${DALTON_WEB_SEARCH_BRIDGE_URL:-http://host.docker.internal:8961}"
    volumes:
      - ./agent_config.dalton.yaml:/app/agent_config.dalton.yaml:ro
      - ./config.dalton.yaml:/app/config.dalton.yaml:ro
      - ./workflows:/app/workflows:ro
      - ./config/dalton:/app/config/dalton:ro
      - ./var/dalton:/app/var/dalton

  frontend:
    # Replace upstream 0.0.0.0:5173 port binding with loopback-only (requires Docker Compose v2.24.4+).
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Everflow}
      VITE_BRAND_MARK: ${VITE_BRAND_MARK:-everflow}
      # Supabase sign-in (docs/dalton/dev-guide/AUTH-DEPLOY.md); empty keeps the no-login local mode.
      VITE_DALTON_AUTH: ${VITE_DALTON_AUTH:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}

  edge:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${DALTON_EDGE_PORT:-8088}:8088"
    volumes:
      - ./deploy/dalton/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv:ro
